services:
  backend:
    build: ./backend
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - CORS_ORIGIN=http://frontend:3000
    volumes:
      - e2e_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - e2e_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_BACKEND_URL=http://backend:8080

  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    environment:
      - BASE_URL=http://frontend:3000
    volumes:
      - ./frontend/e2e:/app/e2e
      - e2e_results:/app/test-results
    command: >
      sh -c "npx playwright test --workers=1 ${SPEC:+e2e/$SPEC}"

volumes:
  e2e_data:
  e2e_results:
  e2e_node_modules:
